name: voice_studio
description: Voice Studio - multilingual translator, speech-to-text and voice generator.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
