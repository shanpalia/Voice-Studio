name: Build Voice Studio APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Generate Android platform files
        run: flutter create . --project-name voice_studio --org com.shanpalia --platforms android

      - name: Configure direct Android Downloads
        run: |
          mkdir -p android/app/src/main/kotlin/com/shanpalia/voice_studio
          cat > android/app/src/main/kotlin/com/shanpalia/voice_studio/MainActivity.kt <<'KOTLIN'
          package com.shanpalia.voice_studio

          import android.content.ContentValues
          import android.content.Intent
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val channel = "voice_studio/download"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channel)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "openDownloadedFile") {
                              val uriString = call.argument<String>("uri")
                              if (uriString.isNullOrBlank()) {
                                  result.error("INVALID_URI", "Downloaded file URI is missing.", null)
                                  return@setMethodCallHandler
                              }
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW).apply {
                                      setDataAndType(android.net.Uri.parse(uriString), "audio/mpeg")
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  startActivity(intent)
                                  result.success(null)
                              } catch (error: Exception) {
                                  result.error("OPEN_FAILED", error.message ?: "Could not open MP3 file.", null)
                              }
                              return@setMethodCallHandler
                          }
                          if (call.method != "saveToDownloads") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }

                          val sourcePath = call.argument<String>("sourcePath")
                          val fileName = call.argument<String>("fileName")
                          if (sourcePath.isNullOrBlank() || fileName.isNullOrBlank()) {
                              result.error("INVALID_ARGUMENT", "Audio file path is missing.", null)
                              return@setMethodCallHandler
                          }

                          try {
                              val source = File(sourcePath)
                              if (!source.exists() || source.length() == 0L) {
                                  result.error("EMPTY_FILE", "Generated audio file is empty.", null)
                                  return@setMethodCallHandler
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  val values = ContentValues().apply {
                                      put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                                      put(MediaStore.Downloads.MIME_TYPE, "audio/mpeg")
                                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Voice Studio")
                                      put(MediaStore.Downloads.IS_PENDING, 1)
                                  }
                                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                                      ?: throw IllegalStateException("Could not create Downloads file")
                                  try {
                                      contentResolver.openOutputStream(uri)?.use { output ->
                                          source.inputStream().use { input -> input.copyTo(output) }
                                      } ?: throw IllegalStateException("Could not open Downloads file")
                                      val done = ContentValues().apply { put(MediaStore.Downloads.IS_PENDING, 0) }
                                      contentResolver.update(uri, done, null, null)
                                      result.success(uri.toString())
                                  } catch (error: Exception) {
                                      contentResolver.delete(uri, null, null)
                                      throw error
                                  }
                              } else {
                                  result.error("UNSUPPORTED_ANDROID", "Direct Downloads requires Android 10 or newer.", null)
                              }
                          } catch (error: Exception) {
                              result.error("DOWNLOAD_FAILED", error.message ?: "Could not save audio.", null)
                          }
                      }
              }
          }
          KOTLIN

      - name: Generate Voice Studio image assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/voice_studio_icon.svg -o assets/voice_studio_icon.png
          rsvg-convert -w 900 -h 1600 assets/voice_studio_splash.svg -o assets/voice_studio_splash.png

      - name: Configure Android permissions and speech recognition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''  <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.BLUETOOTH"/>
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
,
          ]
          patched = text
          total = 0
          for pattern in patterns:
              patched, count = re.subn(pattern, '', patched, flags=re.MULTILINE)
              total += count

          if total:
              gradle.write_text(patched)
              print(f"Removed {total} legacy CMake DSL line(s) from {gradle}")
          else:
              print(f"No legacy CMake DSL lines found in {gradle}; continuing.")
          PY

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
